[project]
name = "dicom-lance-embed"
version = "0.2.0"
description = "Read Lance v2.2 Blob V2 DICOM frames into NumPy/PyTorch, compute 768-d multimodal embeddings, and update Lance datasets live"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pylance>=14.0.3,<15",
    "pyarrow>=18.0.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
biomedclip = [
    "open-clip-torch>=2.29.0",
    "pillow>=10.0.0",
    "torch>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
dicom-lance-embed = "dicom_lance_embed.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dicom_lance_embed"]

[tool.ruff]
line-length = 100
target-version = "py311"
