[graph]
all-features = false

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "0BSD",
  "MIT-0",
  "BSL-1.0",
  "IJG",
]

[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]
