name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  rust-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "examples/pylance-embeddings/uv.lock"

      - name: Run Rust Hegel PBT, integration, and error-path tests
        run: cargo test --locked

      - name: Run Rust Clippy lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build Rust server binary for live E2E
        run: cargo build --locked

      - name: Run Python (uv + pylance) interop lint and tests
        working-directory: examples/pylance-embeddings
        run: |
          uv sync --locked
          uv run ruff check
          uv run pytest -v

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck, build, and run Vitest + Hegel PBT suite
        working-directory: web
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run hermetic Playwright E2E + axe-core WCAG 2.2 AA
        working-directory: web
        run: npm run test:e2e

      - name: Run live Rust + Lance v2.2 + Cornerstone3D WebGL2 E2E
        working-directory: web
        run: npm run test:e2e:live

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --locked
          command: check
          command-arguments: licenses

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dicom-lance:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container startup, seeding, and Lance v2.2 telemetry
        run: |
          docker run -d --name dicom-lance-smoke -p 18095:8090 -e SEED_ON_START=true dicom-lance:ci
          trap 'docker logs dicom-lance-smoke || true; docker rm -f dicom-lance-smoke || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18095/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18095/healthz
          stats=$(curl -sf http://127.0.0.1:18095/api/stats)
          echo "$stats"
          echo "$stats" | jq -e '.frames_dataset.storage_version == "2.2" and .blob_v2_kind_sample == "Packed" and .series_dataset.row_count == 4 and .frames_dataset.row_count == 128'
          curl -sf "http://127.0.0.1:18095/dicomweb/studies/1.2.826.0.1.3680043.10.5432.1001/series/1.2.826.0.1.3680043.10.5432.1001.1/rendered?window=-600,1500" -o /tmp/rendered.png
          test "$(od -An -N4 -tx1 /tmp/rendered.png | tr -d ' \n')" = "89504e47"
          rm -f /tmp/rendered.png
