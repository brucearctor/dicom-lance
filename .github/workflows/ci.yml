name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  rust-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run Rust Hegel PBT, integration, and error-path tests
        run: cargo test --locked

      - name: Run Rust Clippy lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build Rust server binary for live E2E
        run: cargo build --locked

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck, build, and run Vitest + Hegel PBT suite
        working-directory: web
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run hermetic Playwright E2E + axe-core WCAG 2.2 AA
        working-directory: web
        run: npm run test:e2e

      - name: Run live Rust + Lance v2.2 + Cornerstone3D WebGL2 E2E
        working-directory: web
        run: npm run test:e2e:live
